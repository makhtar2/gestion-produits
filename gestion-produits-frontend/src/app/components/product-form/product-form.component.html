<h3>{{ product ? 'Modifier le Produit' : 'Ajouter un nouveau Produit' }}</h3>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    
    <div class="mb-3">
        <label for="nom" class="form-label">Nom du Produit</label>
        <input type="text" class="form-control" formControlName="nom">
        <div *ngIf="productForm.get('nom')?.invalid && productForm.get('nom')?.touched" class="text-danger">
            Le nom est obligatoire.
        </div>
    </div>

    <!-- AJOUT DU CHAMP DESCRIPTION avec validation -->
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" formControlName="description" rows="3"></textarea>
        <div *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched" class="text-danger">
            La description est obligatoire.
        </div>
    </div>

    <div class="mb-3">
        <label for="prix" class="form-label">Prix</label>
        <input type="number" class="form-control" formControlName="prix">
        <div *ngIf="productForm.get('prix')?.invalid && productForm.get('prix')?.touched" class="text-danger">
            Le prix est obligatoire et doit être positif.
        </div>
    </div>

    <div class="mb-3">
        <label for="categorie" class="form-label">Catégorie</label>
        <select class="form-select" formControlName="categorie">
            <option [ngValue]="null" disabled>Sélectionner une catégorie</option>
            <option *ngFor="let cat of categories" [ngValue]="cat.id">
                {{ cat.nom }}
            </option>
        </select>
        <div *ngIf="productForm.get('categorie')?.invalid && productForm.get('categorie')?.touched" class="text-danger">
            La catégorie est obligatoire.
        </div>
    </div>

    <button 
        type="submit" 
        class="btn btn-success me-2"
        [disabled]="productForm.invalid"
    >
        {{ product ? 'Enregistrer les modifications' : 'Ajouter le Produit' }}
    </button>
    
    <button 
        *ngIf="product" 
        type="button" 
        class="btn btn-secondary" 
        (click)="cancelEdit()"
    >
        Annuler l'édition
    </button>
</form>
